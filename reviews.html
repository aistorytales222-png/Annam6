<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Annam - All Reviews</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f6eddb; color: #241a17; margin: 0; padding: 24px; }
    h1 { margin: 0 0 6px; }
    .sub { color: #8a7a70; margin-bottom: 20px; }
    .box { max-width: 900px; margin: 0 auto; }
    input { width: 100%; padding: 12px 16px; border-radius: 999px; border: 1.5px solid #cdbfa8; font-size: 1rem; margin-bottom: 18px; box-sizing: border-box; }
    .rev { background: #fff; border-radius: 12px; padding: 14px 18px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .top { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; }
    .name { font-weight: 700; font-size: 1.05rem; }
    .stars { color: #c9a24b; letter-spacing: 2px; }
    .dish { background: #1c0a0a; color: #e3c677; padding: 2px 12px; border-radius: 999px; font-size: .8rem; }
    .date { color: #8a7a70; font-size: .85rem; margin-left: auto; }
    .text { margin: 8px 0 0; line-height: 1.5; }
    .empty { text-align: center; color: #8a7a70; padding: 40px 0; }
  </style>
</head>
<body>
  <div class="box">
    <h1>All customer reviews</h1>
    <p class="sub" id="count">Loading...</p>
    <input id="search" placeholder="Search by name, dish or text..." />
    <div id="list"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    const listEl = document.getElementById("list");
    const countEl = document.getElementById("count");
    const searchEl = document.getElementById("search");
    let reviews = [];

    function draw() {
      const q = searchEl.value.trim().toLowerCase();
      const shown = reviews.filter((r) =>
        (r.name + " " + r.dish + " " + (r.text || "")).toLowerCase().includes(q)
      );
      countEl.textContent = shown.length + " review" + (shown.length === 1 ? "" : "s");
      listEl.innerHTML = "";
      if (!shown.length) {
        listEl.innerHTML = '<div class="empty">No reviews found.</div>';
        return;
      }
      shown.forEach((r) => {
        const card = document.createElement("div");
        card.className = "rev";

        const top = document.createElement("div");
        top.className = "top";

        const name = document.createElement("span");
        name.className = "name";
        name.textContent = r.name || "Guest";

        const stars = document.createElement("span");
        stars.className = "stars";
        stars.textContent = "\u2605".repeat(r.rating || 0) + "\u2606".repeat(5 - (r.rating || 0));

        const dish = document.createElement("span");
        dish.className = "dish";
        dish.textContent = r.dish;

        const date = document.createElement("span");
        date.className = "date";
        date.textContent = r.date || "";

        top.append(name, stars, dish, date);
        card.append(top);

        if (r.text) {
          const p = document.createElement("p");
          p.className = "text";
          p.textContent = r.text;
          card.append(p);
        }
        listEl.append(card);
      });
    }

    if (typeof db === "undefined" || !db) {
      countEl.textContent = "Firebase is not connected. Check firebase-config.js.";
    } else {
      db.collection("reviews").orderBy("createdAt", "desc").limit(1000).onSnapshot(
        (snap) => { reviews = snap.docs.map((d) => d.data()); draw(); },
        (err) => { console.error(err); countEl.textContent = "Could not load reviews: " + err.message; }
      );
    }
    searchEl.addEventListener("input", draw);
  </script>
</body>
</html>
